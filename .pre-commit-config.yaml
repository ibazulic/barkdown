repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        files: ^(src|include|tests)
        exclude: ^include/DejaVu
  - repo: local
    hooks:
      - id: git-diff
        name: show diff
        entry: git diff --exit-code
        language: system
        pass_filenames: false
        always_run: true
