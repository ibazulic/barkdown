name: Build Packages
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
    - main
  workflow_dispatch:
jobs:
  build-deb:
    name: Build deb package
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libsdl2-dev \
          libcurl4-openssl-dev \
          libcmark-dev \
          libgl1-mesa-dev \
          libstb-dev \
          cmark
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
    - name: Create deb package
      run: |
        cd build
        cpack -G DEB
    - name: List generated package
      run: ls -lh build/*.deb
    - name: Upload deb package
      uses: actions/upload-artifact@v4
      with:
        name: barkdown-deb
        path: build/*.deb
        if-no-files-found: error
  build-rpm:
    name: Build rpm package
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
    - name: Install git
      run: |
        dnf install -y git
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        dnf install -y \
          cmake \
          gcc-c++ \
          make \
          rpm-build \
          SDL2-devel \
          libcurl-devel \
          cmark-devel \
          mesa-libGL-devel \
          cmark \
          stb_image-devel
    - name: Configure CMake
      run: |
        mkdir -pv build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
    - name: Create rpm package
      run: |
        cd build
        cpack -G RPM
    - name: List generated package
      run: ls -lh build/*.rpm
    - name: Upload rpm package
      uses: actions/upload-artifact@v4
      with:
        name: barkdown-rpm
        path: build/*.rpm
        if-no-files-found: error
  create-release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download deb package
      uses: actions/download-artifact@v4
      with:
        name: barkdown-deb
        path: packages
    - name: Download rpm package
      uses: actions/download-artifact@v4
      with:
        name: barkdown-rpm
        path: packages
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: packages/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

