name: Build and test
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  build-executable:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libsdl2-dev \
            libcurl4-openssl-dev \
            libcmark-dev \
            libgl1-mesa-dev \
            libstb-dev \
            cmark
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: |
          cd build
          make -j$(nproc)
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
